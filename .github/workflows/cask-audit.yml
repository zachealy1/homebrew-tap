name: Homebrew cask audit

on:
  push:
    paths:
      - "Casks/**"
      - ".github/workflows/cask-audit.yml"
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/cask-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Apple Silicon and Intel casks
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Update Homebrew
        run: brew update
      - name: Audit the checked-out tap
        run: |
          brew trust --cask zachealy1/tap/orchestrator
          brew tap zachealy1/tap "$GITHUB_WORKSPACE"
          brew config
          brew audit --cask --strict --online --arch=all zachealy1/tap/orchestrator
